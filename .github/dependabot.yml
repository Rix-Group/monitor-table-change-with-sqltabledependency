# Public NuGet packages only: no private registry or credentials are required.
# Update this counter to retrigger Dependabot: 1
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 0
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/London
    cooldown:
      default-days: 0
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"